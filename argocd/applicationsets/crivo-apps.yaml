# ============================================================================
# ArgoCD ApplicationSet - Crivo Multi-Env (chart genérico crivo-app)
# ============================================================================
# Branch flow:  feature/* -> develop -> main (production)
# Chart único:  helm/crivo-app
# Values:       helm/crivo-app/apps/<app>/values.yaml
#               helm/crivo-app/apps/<app>/values-<env>.yaml
#
# Para adicionar um novo app: crie helm/crivo-app/apps/<novo-app>/
#   com values.yaml + values-develop.yaml + values-prod.yaml, e adicione o
#   nome do app na lista `apps` abaixo.
#
# Para adicionar um novo ambiente: adicione um item em `envs` e crie o
# correspondente AppProject em argocd/projects/.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: crivo-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - env: develop
                  branch: develop
                - env: prod
                  branch: main
          - list:
              elements:
                - app: crivo-auth
                - app: crivo-be
                - app: crivo-fe
  template:
    metadata:
      name: "{{ .app }}-{{ .env }}"
      labels:
        app: "{{ .app }}"
        environment: "{{ .env }}"
    spec:
      project: "crivo-{{ .env }}"
      source:
        repoURL: https://github.com/geraldobl58/infra.git
        targetRevision: "{{ .branch }}"
        path: helm/crivo-app
        helm:
          releaseName: "{{ .app }}"
          valueFiles:
            - "apps/{{ .app }}/values.yaml"
            - "apps/{{ .app }}/values-{{ .env }}.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: "crivo-{{ .env }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
  syncPolicy:
    preserveResourcesOnDeletion: false
