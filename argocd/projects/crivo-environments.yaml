# ============================================================================
# ArgoCD AppProjects - Crivo
# Ambientes: develop, prod
# Para adicionar um novo ambiente, copie um bloco abaixo, troque o nome e
# adicione o env correspondente no ApplicationSet.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: crivo-develop
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Crivo - Development
  sourceRepos:
    - https://github.com/geraldobl58/infra.git
  destinations:
    - namespace: crivo-develop
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: crivo-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Crivo - Production
  sourceRepos:
    - https://github.com/geraldobl58/infra.git
  destinations:
    - namespace: crivo-prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
