# ============================================================================
# ServiceMonitors para monitorar aplicações DevOps no Grafana/Prometheus
# ============================================================================
# Prometheus já está configurado para coletar métricas de todos os namespaces
# via servicemonitorSelectorNilUsesHelmValues: false
#
# Este arquivo cria ServiceMonitors para os serviços DevOps exportarem métricas
# ============================================================================

---
# ServiceMonitor para crivo-be (Backend NestJS)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crivo-be
  namespace: crivo-develop
  labels:
    app: crivo-be
    environment: develop
spec:
  selector:
    matchLabels:
      app: crivo-be
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crivo-be
  namespace: crivo-prod
  labels:
    app: crivo-be
    environment: prod
spec:
  selector:
    matchLabels:
      app: crivo-be
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
# ServiceMonitor para crivo-fe (Frontend Next.js)
# Next.js não expõe métricas Prometheus por padrão
# Use: https://github.com/lirantal/next-prometheus-plugin
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crivo-fe
  namespace: crivo-develop
  labels:
    app: crivo-fe
    environment: develop
spec:
  selector:
    matchLabels:
      app: crivo-fe
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crivo-fe
  namespace: crivo-prod
  labels:
    app: crivo-fe
    environment: prod
spec:
  selector:
    matchLabels:
      app: crivo-fe
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s

---
# ServiceMonitor para crivo-auth (Keycloak)
# Keycloak expõe métricas em /metrics por padrão (quando habilitado)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crivo-auth
  namespace: crivo-develop
  labels:
    app: crivo-auth
    environment: develop
spec:
  selector:
    matchLabels:
      app: crivo-auth
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crivo-auth
  namespace: crivo-prod
  labels:
    app: crivo-auth
    environment: prod
spec:
  selector:
    matchLabels:
      app: crivo-auth
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s


