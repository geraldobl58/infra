---
# ── crivo-kong (API Gateway) — develop ──────────────────────────────────────
# Kong com plugin prometheus expõe /metrics na admin API (porta 8001).
# Plugin precisa estar no kong.yml: `plugins: - name: prometheus`
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crivo-kong
  namespace: crivo-develop
  labels:
    app.kubernetes.io/name: crivo-kong
    app.kubernetes.io/part-of: crivo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: crivo-kong
  endpoints:
    - port: admin
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
# ── crivo-kong (API Gateway) — prod ─────────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
