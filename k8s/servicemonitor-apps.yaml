# ============================================================================
# ServiceMonitors para monitorar aplicações DevOps no Grafana/Prometheus
# ============================================================================
# Prometheus já está configurado para coletar métricas de todos os namespaces
# via servicemonitorSelectorNilUsesHelmValues: false
#
# Este arquivo cria ServiceMonitors para os serviços DevOps exportarem métricas
# ============================================================================

---
# ServiceMonitor para devops-be (Backend NestJS)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devops-be
  namespace: devops-develop
  labels:
    app: devops-be
    environment: develop
spec:
  selector:
    matchLabels:
      app: devops-be
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devops-be
  namespace: devops-prod
  labels:
    app: devops-be
    environment: prod
spec:
  selector:
    matchLabels:
      app: devops-be
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
# ServiceMonitor para devops-fe (Frontend Next.js)
# Next.js não expõe métricas Prometheus por padrão
# Use: https://github.com/lirantal/next-prometheus-plugin
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devops-fe
  namespace: devops-develop
  labels:
    app: devops-fe
    environment: develop
spec:
  selector:
    matchLabels:
      app: devops-fe
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devops-fe
  namespace: devops-prod
  labels:
    app: devops-fe
    environment: prod
spec:
  selector:
    matchLabels:
      app: devops-fe
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s

---
# ServiceMonitor para devops-auth (Keycloak)
# Keycloak expõe métricas em /metrics por padrão (quando habilitado)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devops-auth
  namespace: devops-develop
  labels:
    app: devops-auth
    environment: develop
spec:
  selector:
    matchLabels:
      app: devops-auth
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devops-auth
  namespace: devops-prod
  labels:
    app: devops-auth
    environment: prod
spec:
  selector:
    matchLabels:
      app: devops-auth
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s


