# ════════════════════════════════════════════════════════════════════════════
# ServiceMonitors para Prometheus coletar métricas das apps crivo-*
# ════════════════════════════════════════════════════════════════════════════
# Prometheus (kube-prometheus-stack) está com serviceMonitorSelector: {} e
# serviceMonitorNamespaceSelector: {} — pega todos os ServiceMonitors em
# qualquer namespace sem filtro de label.
#
# Labels do Service (criado pelo chart crivo-app):
#   app.kubernetes.io/name: <app>
#   app.kubernetes.io/instance: <app>
#
# Apps que expõem /metrics:
#   - crivo-auth (Keycloak 26): porta 9000 (management), path /metrics
#   - crivo-be (NestJS): TODO — adicionar @willsoto/nestjs-prometheus
#   - crivo-fe (Next.js): TODO — adicionar next-prometheus-plugin
#   - crivo-kong (Kong 3.9): porta 8001 (admin), path /metrics (plugin prometheus)
#
# Aplicar:
#   kubectl apply -f k8s/servicemonitor-apps.yaml
# ════════════════════════════════════════════════════════════════════════════

---
# ── crivo-auth (Keycloak) — develop ─────────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crivo-auth
  namespace: crivo-develop
  labels:
    app.kubernetes.io/name: crivo-auth
    app.kubernetes.io/part-of: crivo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: crivo-auth
  endpoints:
    - port: management
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
# ── crivo-auth (Keycloak) — prod ────────────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crivo-auth
  namespace: crivo-prod
  labels:
    app.kubernetes.io/name: crivo-auth
    app.kubernetes.io/part-of: crivo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: crivo-auth
  endpoints:
    - port: management
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
# ── crivo-be (NestJS) — develop ─────────────────────────────────────────────
# /metrics retorna 404 hoje. Para ativar:
#   1. npm i @willsoto/nestjs-prometheus prom-client --workspace crivo-be
#   2. Importar PrometheusModule.register() no AppModule
#   3. /metrics fica exposto automaticamente na porta principal (3000)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crivo-be
  namespace: crivo-develop
  labels:
    app.kubernetes.io/name: crivo-be
    app.kubernetes.io/part-of: crivo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: crivo-be
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
# ── crivo-be (NestJS) — prod ────────────────────────────────────────────────
