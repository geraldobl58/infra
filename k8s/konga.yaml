# ============================================================================
# Konga - Kong Admin UI (única instância pra develop + prod)
# Acesso: http://konga.devops.local (após /etc/hosts)
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: tooling
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: konga-data
  namespace: tooling
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: konga
  namespace: tooling
  labels:
    app: konga
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: konga
  template:
    metadata:
      labels:
        app: konga
    spec:
      # Konga roda como user 1000; o local-path provisioner ajusta perms no
      # mount, mas garantimos isso aqui também.
      securityContext:
        fsGroup: 1000
      # initContainer pra limpar metadata AppleDouble do macOS (mesma razão
      # do Postgres). Konga grava em sqlite + JSON, o que tropeça nos ._*.
      initContainers:
        - name: cleanup-macos-metadata
          image: alpine:3
          command:
            - sh
            - -c
            - |
              if [ -d /app/kongadata ]; then
                find /app/kongadata -name '._*' -delete 2>/dev/null || true
                find /app/kongadata -name '.DS_Store' -delete 2>/dev/null || true
              fi
              chown -R 1000:1000 /app/kongadata 2>/dev/null || true
              echo "cleanup done"
          volumeMounts:
            - name: data
              mountPath: /app/kongadata
      containers:
        - name: konga
          image: pantsel/konga:0.14.9
          ports:
            - name: http
              containerPort: 1337
          env:
            - name: NODE_ENV
              value: development
            - name: DB_ADAPTER
              value: localDiskDb
            - name: TOKEN_SECRET
              value: crivo-konga-dev-secret
            # Pré-popula uma conexão por ambiente pra Konga já listar os
            # Kongs assim que sobe. KONGA_SEED_KONG_NODE_DATA_SOURCE_FILE
            # aponta para JSON com a lista de nodes.
            - name: KONGA_SEED_KONG_NODE_DATA_SOURCE_FILE
              value: /seeds/kong-nodes.json
          volumeMounts:
            - name: data
              mountPath: /app/kongadata
            - name: seeds
              mountPath: /seeds
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 1337
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: konga-data
        - name: seeds
          configMap:
            name: konga-seeds
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: konga-seeds
  namespace: tooling
data:
  kong-nodes.json: |
    [
      {
        "name": "crivo-develop",
        "type": "default",
        "kong_admin_url": "http://crivo-kong.crivo-develop.svc.cluster.local:8001"
      },
      {
        "name": "crivo-prod",
        "type": "default",
        "kong_admin_url": "http://crivo-kong.crivo-prod.svc.cluster.local:8001"
      }
    ]
---
apiVersion: v1
kind: Service
metadata:
  name: konga
  namespace: tooling
  labels:
    app: konga
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 1337
      targetPort: 1337
  selector:
    app: konga
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: konga
  namespace: tooling
  labels:
    app: konga
spec:
  ingressClassName: nginx
  rules:
    - host: konga.devops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: konga
                port:
                  number: 1337
