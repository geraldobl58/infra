# Values for Development environment
replicaCount: 1

image:
  repository: ghcr.io/geraldobl58/crivo-auth
  tag: "develop-3f6ff070d963178ebc4d95527f97e852ea83f3a4"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

# Keycloak management port (health + metrics)

# Usar start-dev em develop para hot-reload de temas
args:
  - start-dev
  - --http-enabled=true
  - --hostname-strict=false
  - --metrics-enabled=true
  - --health-enabled=true

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
  hosts:
    - host: develop.auth.crivo.local
      paths:
        - path: /
          pathType: Prefix

livenessProbe:
  enabled: true
  path: /health/live
  port: http
  initialDelaySeconds: 240
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 20

readinessProbe:
  enabled: true
  path: /health/ready
  port: http
  initialDelaySeconds: 180
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 20

resources:
  limits:
    cpu: 400m
    memory: 768Mi
  requests:
    cpu: 10m
    memory: 128Mi

autoscaling:
  enabled: false

env:
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin"
  KC_HOSTNAME_URL: "http://prod.auth.crivo.local"
  KC_HOSTNAME_ADMIN_URL: "http://prod.auth.crivo.local"
  KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
  KC_HOSTNAME_STRICT: "false"
  KC_PROXY_HEADERS: "xforwarded"
  KC_HTTP_ENABLED: "true"
  KC_HEALTH_ENABLED: "true"
  KC_METRICS_ENABLED: "true"

podDisruptionBudget:
  enabled: false

podAnnotations:
  app.kubernetes.io/commit: "3f6ff07"
