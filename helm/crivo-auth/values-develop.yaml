# Values for Development environment
replicaCount: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: "26.5"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

# Usar start-dev em develop para hot-reload de temas
args:
  - start-dev
  - --http-enabled=true
  - --hostname-strict=false
  - --metrics-enabled=true
  - --health-enabled=true

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
  hosts:
    - host: develop.auth.crivo.local
      paths:
        - path: /
          pathType: Prefix

livenessProbe:
  enabled: true
  path: /health/live
  port: http
  initialDelaySeconds: 240
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 20

readinessProbe:
  enabled: true
  path: /health/ready
  port: http
  initialDelaySeconds: 180
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 20

resources:
  limits:
    cpu: 400m
    memory: 768Mi
  requests:
    cpu: 10m
    memory: 128Mi

autoscaling:
  enabled: false

env:
  # Admin Bootstrap (Keycloak 26+)
  KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
  KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
  # Database — Postgres Docker conectado à rede k3d-devops-lab
  KC_DB: "postgres"
  KC_DB_URL: "jdbc:postgresql://172.19.0.11:5432/crivo_keycloak"
  KC_DB_USERNAME: "crivo"
  KC_DB_PASSWORD: "crivo_password"
  # HTTP / Hostname
  KC_HTTP_ENABLED: "true"
  KC_HOSTNAME: "develop.auth.crivo.local"
  KC_HOSTNAME_STRICT: "false"
  KC_HOSTNAME_STRICT_HTTPS: "false"
  KC_PROXY_HEADERS: "xforwarded"
  # Health / Metrics
  KC_HEALTH_ENABLED: "true"
  KC_METRICS_ENABLED: "true"
  # Theme cache off em dev
  KC_SPI_THEME_STATIC_MAX_AGE: "-1"
  KC_SPI_THEME_CACHE_THEMES: "false"
  KC_SPI_THEME_CACHE_TEMPLATES: "false"

extraVolumes: []
extraVolumeMounts: []

hostAliases:
  - ip: "10.43.45.3"
    hostnames:
      - develop.auth.crivo.local
      - develop.be.crivo.local
      - develop.fe.crivo.local

podDisruptionBudget:
  enabled: false

podAnnotations:
  app.kubernetes.io/commit: "3f6ff07"
