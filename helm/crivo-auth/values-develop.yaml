# Values for Development environment
replicaCount: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: "26.5"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

# Usar start-dev em develop para hot-reload de temas
args:
  - start-dev
  - --http-enabled=true
  - --hostname-strict=false
  - --metrics-enabled=true
  - --health-enabled=true

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
  hosts:
    - host: develop.auth.crivo.local
      paths:
        - path: /
          pathType: Prefix

livenessProbe:
  enabled: true
  path: /health/live
  port: http
  initialDelaySeconds: 240
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 20

readinessProbe:
  enabled: true
  path: /health/ready
  port: http
  initialDelaySeconds: 180
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 20

resources:
  limits:
    cpu: 400m
    memory: 768Mi
  requests:
    cpu: 10m
    memory: 128Mi

autoscaling:
  enabled: false

env:
  # Admin Bootstrap (Keycloak 26+)
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    value: "admin"
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    value: "admin"
  # Database — Postgres Docker conectado à rede k3d-devops-lab
  - name: KC_DB
    value: "postgres"
  - name: KC_DB_URL
    value: "jdbc:postgresql://172.19.0.11:5432/crivo_keycloak"
  - name: KC_DB_USERNAME
    value: "crivo"
  - name: KC_DB_PASSWORD
    value: "crivo_password"
  # HTTP / Hostname
  - name: KC_HTTP_ENABLED
    value: "true"
  - name: KC_HOSTNAME_URL
    value: "http://develop.auth.crivo.local"
  - name: KC_HOSTNAME_ADMIN_URL
    value: "http://develop.auth.crivo.local"
  - name: KC_HOSTNAME_STRICT
    value: "false"
  - name: KC_HOSTNAME_STRICT_HTTPS
    value: "false"
  - name: KC_PROXY_HEADERS
  - name: KC_PROXY
    value: "edge"
    value: "xforwarded"
  # Health / Metrics
  - name: KC_HEALTH_ENABLED
    value: "true"
  - name: KC_METRICS_ENABLED
    value: "true"
  # Theme cache off em dev
  - name: KC_SPI_THEME_STATIC_MAX_AGE
    value: "-1"
  - name: KC_SPI_THEME_CACHE_THEMES
    value: "false"
  - name: KC_SPI_THEME_CACHE_TEMPLATES
    value: "false"

extraVolumes:
  - name: theme-nexo
    configMap:
      name: keycloak-theme-nexo-login
extraVolumeMounts:
  - name: theme-nexo
    mountPath: /opt/keycloak/themes/nexo/login/login.ftl
    subPath: login.ftl
  - name: theme-nexo
    mountPath: /opt/keycloak/themes/nexo/login/theme.properties
    subPath: theme.properties

hostAliases:
  - ip: "10.43.45.3"
    hostnames:
      - develop.auth.crivo.local
      - develop.be.crivo.local
      - develop.fe.crivo.local

podDisruptionBudget:
  enabled: false

podAnnotations:
  app.kubernetes.io/commit: "3f6ff07"
