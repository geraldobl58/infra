# Auth (Keycloak) — valores comuns a todos os ambientes.
app:
  name: crivo-auth

image:
  repository: quay.io/keycloak/keycloak
  # Bate com a versão do docker-compose do Crivo (26.5).
  tag: "26.5"
  pullPolicy: IfNotPresent

# Keycloak: 8080 HTTP, 9000 management (health/metrics) no Keycloak 26.
service:
  type: ClusterIP
  port: 8080

extraPorts:
  - name: management
    containerPort: 9000

# args do entrypoint do Keycloak (modo dev é apropriado pro lab).
args:
  - start-dev
  - --http-enabled=true
  - --hostname-strict=false
  - --metrics-enabled=true
  - --health-enabled=true
  - --proxy-headers=xforwarded

ingress:
  enabled: true
  className: nginx
  path: /
  pathType: Prefix
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"

# Health endpoints do Keycloak 26 vivem na porta management (9000), não na 8080.
livenessProbe:
  enabled: true
  path: /health/live
  port: management
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 20

readinessProbe:
  enabled: true
  path: /health/ready
  port: management
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

resources:
  limits:
    cpu: 400m
    memory: 768Mi
  requests:
    cpu: 10m
    memory: 128Mi

# Variáveis públicas. Sensíveis (admin password, DB password) via envFrom.
env:
  KC_DB: postgres
  KC_HTTP_ENABLED: "true"
  KC_HOSTNAME_STRICT: "false"
  KC_HOSTNAME_STRICT_HTTPS: "false"
  KC_PROXY_HEADERS: xforwarded
  KC_HEALTH_ENABLED: "true"
  KC_METRICS_ENABLED: "true"

# Secrets esperados no namespace:
#   crivo-auth-admin (KC_BOOTSTRAP_ADMIN_USERNAME, KC_BOOTSTRAP_ADMIN_PASSWORD)
#   crivo-auth-db    (KC_DB_URL, KC_DB_USERNAME, KC_DB_PASSWORD)
envFrom:
  - secretRef: crivo-auth-admin
  - secretRef: crivo-auth-db
