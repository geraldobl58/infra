# Auth (Keycloak) — valores comuns a todos os ambientes.
app:
  name: crivo-auth

image:
  repository: quay.io/keycloak/keycloak
  # Bate com a versão do docker-compose do Crivo (26.5).
  tag: "26.5"
  pullPolicy: IfNotPresent

# Keycloak: 8080 HTTP, 9000 management (health/metrics) no Keycloak 26.
service:
  type: ClusterIP
  port: 8080

extraPorts:
  # Management port (9000) — health probes + Prometheus /metrics.
  # servicePort: 9000 expõe no Service para Prometheus scrape via ServiceMonitor.
  - name: management
    containerPort: 9000
    servicePort: 9000

# args do entrypoint do Keycloak (modo dev é apropriado pro lab).
# --import-realm: se o ConfigMap keycloak-realm-import existir no namespace,
# importa o realm contido no arquivo realm.json no startup.
# Estratégia: OVERWRITE_EXISTING (re-aplica o realm a cada restart com a
# versão do arquivo). Como dados são voláteis (Postgres emptyDir), isso
# garante que o realm está sempre sincronizado com o realm.json em git.
env:
  KC_DB: postgres
  KC_HTTP_ENABLED: "true"
  KC_HOSTNAME_STRICT: "false"
  KC_HOSTNAME_STRICT_HTTPS: "false"
  KC_PROXY_HEADERS: xforwarded
  KC_HEALTH_ENABLED: "true"
  KC_METRICS_ENABLED: "true"
  KEYCLOAK_IMPORT_STRATEGY: OVERWRITE_EXISTING

args:
  - start-dev
  - --http-enabled=true
  - --hostname-strict=false
  - --metrics-enabled=true
  - --health-enabled=true
  - --proxy-headers=xforwarded
  - --import-realm

ingress:
  enabled: true
  className: nginx
  path: /
  pathType: Prefix
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"

# Health endpoints do Keycloak 26 vivem na porta management (9000), não na 8080.
livenessProbe:
  enabled: true
  path: /health/live
  port: management
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 20

readinessProbe:
  enabled: true
  path: /health/ready
  port: management
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

resources:
  limits:
    cpu: 400m
    memory: 768Mi
  requests:
    cpu: 10m
    memory: 128Mi

# Secrets esperados no namespace:
#   crivo-auth-admin (KC_BOOTSTRAP_ADMIN_USERNAME, KC_BOOTSTRAP_ADMIN_PASSWORD)
#   crivo-auth-db    (KC_DB_URL, KC_DB_USERNAME, KC_DB_PASSWORD)
envFrom:
  - secretRef: crivo-auth-admin
  - secretRef: crivo-auth-db

# Monta ConfigMap keycloak-realm-import (criado por
# scripts/import-keycloak-realm.sh) com optional: true.
# Se não existir no namespace, Keycloak sobe normalmente sem import.
extraVolumes:
  - name: realm-import
    configMap:
      name: keycloak-realm-import
      optional: true

extraVolumeMounts:
  - name: realm-import
    mountPath: /opt/keycloak/data/import
