app:
  environment: develop

ingress:
  host: develop.auth.crivo.local

env:
  KC_HOSTNAME_URL: http://develop.auth.crivo.local
  KC_HOSTNAME_ADMIN_URL: http://develop.auth.crivo.local
  # Theme cache off (mais conveniente em dev)
  KC_SPI_THEME_STATIC_MAX_AGE: "-1"
  KC_SPI_THEME_CACHE_THEMES: "false"
  KC_SPI_THEME_CACHE_TEMPLATES: "false"

# Args inclui --import-realm: ao subir, se /opt/keycloak/data/import/realm.json
# existir, Keycloak importa o realm automaticamente (idempotente: não duplica).
args:
  - start-dev
  - --http-enabled=true
  - --hostname-strict=false
  - --metrics-enabled=true
  - --health-enabled=true
  - --proxy-headers=xforwarded
  - --import-realm

# Monta:
#   1) Tema custom Nexo se ConfigMap keycloak-theme-nexo-login existir
#   2) Realm export se ConfigMap keycloak-realm-import existir
# Os dois com optional: true — Keycloak sobe normalmente se faltar.
extraVolumes:
  - name: theme-nexo
    configMap:
      name: keycloak-theme-nexo-login
      optional: true
  - name: realm-import
    configMap:
      name: keycloak-realm-import
      optional: true

extraVolumeMounts:
  - name: theme-nexo
    mountPath: /opt/keycloak/themes/nexo/login/login.ftl
    subPath: login.ftl
  - name: theme-nexo
    mountPath: /opt/keycloak/themes/nexo/login/theme.properties
    subPath: theme.properties
  - name: realm-import
    mountPath: /opt/keycloak/data/import

hostAliases:
  - ip: "10.43.45.3"
    hostnames:
      - develop.auth.crivo.local
      - develop.be.crivo.local
      - develop.fe.crivo.local
