# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  Kong API Gateway — Declarative Configuration (DB-less mode)                 ║
# ║  Template renderizado por scripts/apply-kong-config.sh                       ║
# ║  Substituições:                                                              ║
# ║    {{ENV}}                  — develop / prod                                 ║
# ║    {{KEYCLOAK_HOST}}        — develop.auth.crivo.local                       ║
# ║    {{KEYCLOAK_REALM}}       — crivo                                          ║
# ║    {{KEYCLOAK_RSA_PUB}}     — chave pública RS256 do realm (vem do .env)     ║
# ║    {{FRONTEND_ORIGIN}}      — http://develop.fe.crivo.local                  ║
# ║    {{BE_INTERNAL_URL}}      — http://crivo-be.crivo-develop.svc:3000         ║
# ║    {{AUTH_INTERNAL_URL}}    — http://crivo-auth.crivo-develop.svc:8080       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
_format_version: "3.0"
_transform: true

services:
  # ── Crivo Backend API ──────────────────────────────────────────────────────
  - name: crivo-api
    url: {{BE_INTERNAL_URL}}
    connect_timeout: 10000
    write_timeout: 60000
    read_timeout: 60000
    retries: 2
    routes:
      - name: crivo-stripe-webhook
        paths: [/api/stripe/webhook]
        methods: [POST]
        strip_path: true
        preserve_host: false
        protocols: [http, https]
        plugins:
          - name: rate-limiting
            config:
              minute: 1000
              policy: local
              fault_tolerant: true

      - name: crivo-api-routes
        paths: [/api]
        strip_path: true
        preserve_host: false
        protocols: [http, https]
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify: [exp]
              anonymous: "00000000-0000-0000-0000-000000000002"
              header_names: [Authorization]
              uri_param_names: []
              cookie_names: []
              run_on_preflight: false

          - name: pre-function
            config:
              access:
                - |
                  -- [1/3] Decodifica JWT payload
                  local auth = kong.request.get_header("Authorization")
                  if not auth then return end
                  local token = auth:match("^[Bb]earer%s+(.+)$")
                  if not token then return end
                  local parts = {}
                  for part in token:gmatch("[^.]+") do parts[#parts + 1] = part end
                  if #parts ~= 3 then return end
                  local function b64url_decode(s)
                    s = s:gsub("%-", "+"):gsub("_", "/")
                    local pad = (4 - (#s % 4)) % 4
                    return ngx.decode_base64(s .. string.rep("=", pad))
                  end
                  local payload_json = b64url_decode(parts[2])
                  if not payload_json then return end
                  local cjson_ok, cjson = pcall(require, "cjson.safe")
                  if not cjson_ok then return end
                  local claims = cjson.decode(payload_json)
                  if type(claims) == "table" then
                    kong.ctx.shared.jwt_claims = claims
                  end
                - |
                  -- [2/3] Rate Limiting por Plano
                  local claims = kong.ctx.shared.jwt_claims
                  if not claims then return end
                  local plan_type = claims.plan_type
                  local sub = claims.sub
                  if not plan_type or not sub then return end
                  local LIMITS = { TRIAL = 30, BASIC = 60, PROFESSIONAL = 120, ENTERPRISE = 10000 }
                  local limit = LIMITS[plan_type]
                  if not limit then return end
                  local key = "crivo:rl:" .. sub .. ":" .. math.floor(ngx.time() / 60)
                  local count = ngx.shared.kong:incr(key, 1, 0, 70)
                  if not count then return end
                  kong.response.set_header("X-Plan-RateLimit-Limit-Minute", tostring(limit))
                  if count > limit then
                    kong.response.set_header("X-Plan-RateLimit-Remaining-Minute", "0")
                    return kong.response.exit(429, {
                      message = "Rate limit exceeded for your plan. Upgrade to increase your limit.",
                      plan = plan_type,
                      limit_per_minute = limit
                    })
                  end
                  kong.response.set_header("X-Plan-RateLimit-Remaining-Minute", tostring(math.max(0, limit - count)))
                - |
                  -- [3/3] RBAC delegado pro NestJS RolesGuard
                  return

      - name: crivo-docs
        paths: [/docs]
        strip_path: false
        preserve_host: false
        protocols: [http]

    plugins:
      - name: rate-limiting
        config:
          minute: 120
          policy: local
          fault_tolerant: true
          hide_client_headers: false
          error_code: 429
          error_message: "Rate limit exceeded. Please try again later."

      - name: cors
        config:
          origins: ["{{FRONTEND_ORIGIN}}"]
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          headers: [Authorization, Content-Type, Accept, X-Request-Id, X-Stripe-Signature]
          exposed_headers:
            - X-RateLimit-Limit-Minute
            - X-RateLimit-Remaining-Minute
            - X-Plan-RateLimit-Limit-Minute
            - X-Plan-RateLimit-Remaining-Minute
            - X-Kong-Request-Id
          credentials: true
          max_age: 3600
          preflight_continue: false

      - name: request-size-limiting
        config:
          allowed_payload_size: 50
          size_unit: megabytes
          require_content_length: false

      - name: correlation-id
        config:
          header_name: X-Request-Id
          generator: uuid#counter
          echo_downstream: true

  # ── Keycloak ───────────────────────────────────────────────────────────────
  - name: crivo-auth
    url: {{AUTH_INTERNAL_URL}}
    connect_timeout: 10000
    write_timeout: 30000
    read_timeout: 30000
    retries: 1
    routes:
      - name: keycloak-auth
        paths: [/auth]
        strip_path: true
        preserve_host: false
        protocols: [http, https]

      - name: keycloak-admin
        paths: [/admin]
        strip_path: false
        preserve_host: false
        protocols: [http, https]

    plugins:
      - name: rate-limiting
        config:
          minute: 30
          policy: local
          fault_tolerant: true
          hide_client_headers: false
          error_code: 429
          error_message: "Too many authentication attempts. Please wait."

# ──────────────────────────────────────────────────────────────────────────────
# Consumers — JWT RS256 do Keycloak
# ──────────────────────────────────────────────────────────────────────────────
consumers:
  - username: keycloak-users
    id: "00000000-0000-0000-0000-000000000001"
    jwt_secrets:
      - algorithm: RS256
        # 'key' precisa bater com claim 'iss' do JWT emitido pelo Keycloak.
        key: http://{{KEYCLOAK_HOST}}/realms/{{KEYCLOAK_REALM}}
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
{{KEYCLOAK_RSA_PUB_INDENTED}}
          -----END PUBLIC KEY-----

  - username: anonymous
    id: "00000000-0000-0000-0000-000000000002"

# ──────────────────────────────────────────────────────────────────────────────
# Global plugins
# ──────────────────────────────────────────────────────────────────────────────
plugins:
  - name: bot-detection
    config:
      deny: [Scrapy, SemrushBot, AhrefsBot, MJ12bot]

  - name: response-transformer
    config:
      add:
        headers:
          - "X-Content-Type-Options: nosniff"
          - "X-Frame-Options: DENY"
          - "X-XSS-Protection: 1; mode=block"
          - "Referrer-Policy: strict-origin-when-cross-origin"
          - "Permissions-Policy: camera=(), microphone=(), geolocation=()"
