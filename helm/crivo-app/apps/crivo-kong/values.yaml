# Kong API Gateway (DB-less) — valores comuns a todos os ambientes.
app:
  name: crivo-kong

image:
  repository: kong
  tag: "3.9"
  pullPolicy: IfNotPresent

# Kong proxy roda em 8000.
service:
  type: ClusterIP
  port: 8000

extraPorts:
  - name: admin
    containerPort: 8001

ingress:
  enabled: true
  className: nginx
  path: /
  pathType: Prefix
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"

# Kong tem /status na porta admin (8001) por padrão.
livenessProbe:
  enabled: true
  path: /status
  port: admin
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6

readinessProbe:
  enabled: true
  path: /status
  port: admin
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6

resources:
  limits:
    cpu: 400m
    memory: 384Mi
  requests:
    cpu: 20m
    memory: 96Mi

# DB-less + arquivo declarativo em /kong/kong.yml (vem via ConfigMap).
env:
  KONG_DATABASE: "off"
  KONG_DECLARATIVE_CONFIG: /kong/kong.yml
  KONG_PROXY_LISTEN: "0.0.0.0:8000"
  KONG_ADMIN_LISTEN: "0.0.0.0:8001"
  KONG_LOG_LEVEL: info
  KONG_PLUGINS: bundled
  KONG_TRUSTED_IPS: "0.0.0.0/0,::/0"
  KONG_REAL_IP_HEADER: X-Forwarded-For
  KONG_REAL_IP_RECURSIVE: "on"
  KONG_PROXY_ACCESS_LOG: /dev/stdout
  KONG_ADMIN_ACCESS_LOG: /dev/stdout
  KONG_PROXY_ERROR_LOG: /dev/stderr
  KONG_ADMIN_ERROR_LOG: /dev/stderr

# Monta o kong.yml como volume vindo de ConfigMap crivo-kong-config
# (criado em apps/crivo-kong/templates-overrides via deployment do values).
extraVolumes:
  - name: kong-config
    configMap:
      name: crivo-kong-config

extraVolumeMounts:
  - name: kong-config
    mountPath: /kong
    readOnly: true
