app:
  environment: develop

image:
  tag: "develop-5ce4cbf5cb32882821d45e0f1971d2ae884e311c"

ingress:
  host: develop.fe.crivo.local

env:
  NODE_ENV: development
  BETTER_AUTH_URL: http://develop.fe.crivo.local
  # API_URL e INTERNAL_API_URL: server-side chama o BE direto pelo Service
  # interno (não passa por Kong em SSR — performance + sem trip externa).
  API_URL: http://crivo-be.crivo-develop.svc.cluster.local:3000
  INTERNAL_API_URL: http://crivo-be.crivo-develop.svc.cluster.local:3000
  # NEXT_PUBLIC_API_URL: browser passa por Kong (API gateway com JWT + rate-limit).
  NEXT_PUBLIC_API_URL: http://develop.api.crivo.local/api
  NEXT_PUBLIC_KEYCLOAK_URL: http://develop.auth.crivo.local
  NEXT_PUBLIC_KEYCLOAK_ISSUER: http://develop.auth.crivo.local/realms/crivo
  # Better Auth precisa do issuer pro genericOAuth/keycloak provider.
  AUTH_KEYCLOAK_ISSUER: http://develop.auth.crivo.local/realms/crivo

hostAliases:
  - ip: "10.43.45.3"
    hostnames:
      - develop.auth.crivo.local
      - develop.be.crivo.local
      - develop.fe.crivo.local
      - develop.api.crivo.local
