# Frontend (Next.js) — valores comuns a todos os ambientes.
app:
  name: crivo-fe

image:
  repository: ghcr.io/geraldobl58/crivo-fe
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: nginx
  path: /
  pathType: Prefix

livenessProbe:
  enabled: true
  path: /
  port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 5

readinessProbe:
  enabled: true
  path: /
  port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 5

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

env:
  NEXT_PUBLIC_KEYCLOAK_REALM: crivo
  NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: crivo-web
  # crivo-web é client PUBLIC (PKCE), sem secret.
  AUTH_KEYCLOAK_ID: crivo-web
  AUTH_KEYCLOAK_SECRET: ""

# crivo-fe-auth: BETTER_AUTH_SECRET
# crivo-fe-db:   DATABASE_URL (Better Auth grava em auth_* nas mesmas tabelas
#                do BE; usa o mesmo Postgres)
envFrom:
  - secretRef: crivo-fe-auth
  - secretRef: crivo-fe-db
