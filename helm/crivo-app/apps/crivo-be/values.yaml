# Backend (NestJS) — valores comuns a todos os ambientes.
app:
  name: crivo-be

image:
  repository: ghcr.io/geraldobl58/crivo-be
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: nginx
  path: /
  pathType: Prefix

livenessProbe:
  enabled: true
  path: /health
  port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 5

readinessProbe:
  enabled: true
  path: /health
  port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 5

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

# Variáveis públicas (não-sensíveis). Tudo sensível vem via envFrom secret.
env:
  PORT: "3000"
  KEYCLOAK_REALM: crivo
  KEYCLOAK_CLIENT_ID: crivo-api
  KEYCLOAK_WEB_CLIENT_ID: crivo-web
  MAIL_PROVIDER: nodemailer
  MAIL_FROM: no-reply@crivo.local
  AI_PROVIDER: anthropic
  STORAGE_PROVIDER: s3
  AWS_REGION: us-east-1

# Secrets esperados no namespace do ambiente:
#   crivo-be-app        (DATABASE_URL, KEYCLOAK_CLIENT_SECRET, BETTER_AUTH_SECRET, etc.)
#   crivo-be-cloudinary (CLOUDINARY_*)
#   crivo-be-stripe     (STRIPE_*)
#   crivo-be-mail       (MAILTRAP_*)
#   crivo-be-ai         (ANTHROPIC_API_KEY)
#   crivo-be-storage    (AWS_*, S3_BUCKET)
envFrom:
  - secretRef: crivo-be-app
  - secretRef: crivo-be-cloudinary
  - secretRef: crivo-be-stripe
  - secretRef: crivo-be-mail
  - secretRef: crivo-be-ai
  - secretRef: crivo-be-storage

# Roda `prisma migrate deploy` antes do container principal.
# Usa a mesma imagem do app (que já vem com prisma/schema embutidos).
# NOTA: requer que a imagem inclua prisma.config.ts + tsconfig.json (Prisma 7+).
# Habilitado por padrão; sobrescreva pra [] em values-<env>.yaml se quiser pular.
#
# Seed: roda apenas se a tabela Plan estiver vazia (evita re-seed destrutivo
# em ambientes onde os dados já existem). Para forçar re-seed manual:
#   make seed ENV=develop
initContainers:
  - name: prisma-migrate
    command: ["sh", "-c", "npx prisma migrate deploy"]
  - name: prisma-seed-if-empty
    command:
      - sh
      - -c
      - |
        set -e
        count=$(node -e "
          const { Pool } = require('pg');
          (async () => {
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            try {
              const r = await pool.query('SELECT COUNT(*)::int AS c FROM \"Plan\"');
              console.log(r.rows[0].c);
            } catch { console.log(0); }
            await pool.end();
          })();
        ")
        if [ "$count" = "0" ]; then
          echo "🌱 Plan table empty, running seed..."
          npx prisma db seed || echo "⚠️  seed failed (non-fatal)"
        else
          echo "✅ Plan table already populated ($count rows), skipping seed."
        fi
