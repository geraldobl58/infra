app:
  environment: develop

image:
  tag: develop

ingress:
  host: develop.be.crivo.local

env:
  NODE_ENV: development
  LOG_LEVEL: debug
  SWAGGER_ENABLED: "true"
  METRICS_ENABLED: "true"
  FRONTEND_URL: http://develop.fe.crivo.local
  KEYCLOAK_BASE_URL: http://develop.auth.crivo.local
  KEYCLOAK_INTERNAL_URL: http://crivo-auth.crivo-develop.svc.cluster.local:8080
  KEYCLOAK_ISSUER: http://develop.auth.crivo.local/realms/crivo
  KEYCLOAK_JWKS_URI: http://develop.auth.crivo.local/realms/crivo/protocol/openid-connect/certs

hostAliases:
  - ip: "10.43.45.3"
    hostnames:
      - develop.auth.crivo.local
      - develop.be.crivo.local
      - develop.fe.crivo.local

# TEMP: a imagem 'develop' atual não tem prisma.config.ts (será incluído na
# próxima build após o fix do Dockerfile). Desabilita migrate até lá; rode
# manualmente uma vez via port-forward se precisar.
initContainers: []
