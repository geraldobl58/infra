# =============================================================================
# Chart genérico crivo-app - defaults
# =============================================================================
# Todo app crivo-* sobrescreve estes valores em:
#   apps/<app>/values.yaml             (valores comuns ao app, todos ambientes)
#   apps/<app>/values-<env>.yaml       (overrides do ambiente)
# =============================================================================

# Identificação (sempre preenchida via apps/<app>/values.yaml)
app:
  name: ""           # ex.: crivo-be (define o nome do release/labels)
  environment: ""    # ex.: develop / prod (preenchido por values-<env>.yaml)

replicaCount: 1

image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 3000

# args opcionais no container (usado pelo Keycloak)
args: []

ingress:
  enabled: true
  className: nginx
  annotations: {}
  # host completo (preenchido por values-<env>.yaml). Ex.: develop.be.crivo.local
  host: ""
  path: /
  pathType: Prefix

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

livenessProbe:
  enabled: true
  path: /
  port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 5

readinessProbe:
  enabled: true
  path: /
  port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# env: map (chave: valor). Conversão para lista é feita no template.
# Use ${ENV} em strings para referenciar app.environment via tpl render.
env: {}

# envFrom: lista de Secrets/ConfigMaps cujas chaves viram env vars.
#   envFrom:
#     - secretRef: crivo-be-database
#     - secretRef: crivo-be-cloudinary
envFrom: []

extraVolumes: []
extraVolumeMounts: []

# hostAliases é específico do lab k3d (quando precisamos que pods resolvam
# domínios .crivo.local que apontam para o ingress controller).
hostAliases: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1

podAnnotations: {}

metrics:
  enabled: false
  path: /metrics
  serviceMonitor:
    enabled: false
