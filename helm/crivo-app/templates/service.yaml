apiVersion: v1
kind: Service
metadata:
  name: {{ include "crivo-app.fullname" . }}
  labels:
    {{- include "crivo-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- range .Values.extraPorts }}
    {{- if .servicePort }}
    - name: {{ .name }}
      port: {{ .servicePort }}
      targetPort: {{ .name }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
    {{- end }}
  selector:
    {{- include "crivo-app.selectorLabels" . | nindent 4 }}
