# Values for Staging environment
replicaCount: 1

image:
  repository: ghcr.io/geraldobl58/crivo-be
  tag: "develop"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

ingress:
  enabled: true
  className: "nginx"
  annotations:
  hosts:
    - host: staging.be.crivo.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

autoscaling:
  enabled: false

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3000"
  - name: LOG_LEVEL
    value: "info"
  - name: SWAGGER_ENABLED
    value: "true"
  - name: METRICS_ENABLED
    value: "true"
  - name: KEYCLOAK_BASE_URL
    value: "http://staging.auth.crivo.local"
  - name: KEYCLOAK_CLIENT_ID
    value: "crivo-api"
  - name: KEYCLOAK_CLIENT_SECRET
    value: "dummy-secret"
  - name: KEYCLOAK_WEB_CLIENT_ID
    value: "crivo-web"
  - name: KEYCLOAK_ISSUER
    value: "http://main.auth.crivo.local/realms/devops"
  - name: KEYCLOAK_JWKS_URI
    value: "http://main.auth.crivo.local/realms/devops/protocol/openid-connect/certs"

  - name: KEYCLOAK_INTERNAL_URL
    value: "http://crivo-auth-staging:8080"
  - name: KEYCLOAK_REALM
    value: "devops"
  - name: FRONTEND_URL
    value: "http://prod.fe.crivo.local"
  - name: DATABASE_URL
    value: "postgresql://crivo:crivo_password@localhost:5432/crivo_app?schema=public"
  - name: MAILTRAP_HOST
    value: "sandbox.smtp.mailtrap.io"
  - name: MAILTRAP_PORT
    value: "587"
  - name: MAILTRAP_USER
    value: "stub"
  - name: MAILTRAP_PASSWORD
    value: "stub"
  - name: MAIL_PROVIDER
    value: "nodemailer"
  - name: MAIL_FROM
    value: "no-reply@crivo.local"
  - name: STRIPE_SECRET_KEY
    value: "sk_test_stub"
  - name: STRIPE_PUBLISHABLE_KEY
    value: "pk_test_stub"
  - name: STRIPE_WEBHOOK_SECRET
    value: "whsec_stub"
  - name: STRIPE_PRICE_TRIAL
    value: "prod_stub"
  - name: STRIPE_PRICE_BASIC
    value: "prod_stub"
  - name: STRIPE_PRICE_PROFESSIONAL
    value: "prod_stub"
  - name: STRIPE_PRICE_ENTERPRISE
    value: "prod_stub"
  - name: AI_PROVIDER
    value: "anthropic"
  - name: ANTHROPIC_API_KEY
    value: "stub"
  - name: STORAGE_PROVIDER
    value: "s3"
  - name: AWS_REGION
    value: "us-east-1"
  - name: AWS_ACCESS_KEY_ID
    value: "stub"
  - name: AWS_SECRET_ACCESS_KEY
    value: "stub"
  - name: S3_BUCKET
    value: "stub"


podDisruptionBudget:
  enabled: false

podAnnotations:
  app.kubernetes.io/commit: "pending"

metrics:
  enabled: false
  path: /metrics
  serviceMonitor:
    enabled: false

# Kubernetes Secret com as credenciais do Cloudinary.
# Criar o secret antes de implantar:
#   kubectl create secret generic crivo-be-cloudinary -n crivo-staging \
#     --from-literal=CLOUDINARY_CLOUD_NAME=xxx \
#     --from-literal=CLOUDINARY_API_KEY=xxx \
#     --from-literal=CLOUDINARY_API_SECRET=xxx \
#     --from-literal=CLOUDINARY_FOLDER=devops
envFrom:
  - secretRef: crivo-be-cloudinary
