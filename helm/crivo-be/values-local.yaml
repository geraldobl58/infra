# DevOps Backend - Local Lab Values
replicaCount: 1

image:
  repository: ghcr.io/geraldobl58/crivo-be
  pullPolicy: Always
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: develop.be.crivo.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: NODE_ENV
    value: "local"
  - name: PORT
    value: "3000"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: devops-secrets
        key: database-url
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: devops-secrets
        key: jwt-secret
  - name: FRONTEND_URL
    value: "http://develop.fe.crivo.local"
  - name: KEYCLOAK_BASE_URL
    value: "http://develop.auth.crivo.local"
  - name: KEYCLOAK_REALM
    value: "crivo"
  - name: KEYCLOAK_CLIENT_ID
    value: "crivo-api"
  - name: KEYCLOAK_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: devops-secrets
        key: keycloak-client-secret
  - name: KEYCLOAK_WEB_CLIENT_ID
    value: "crivo-web"
  - name: KEYCLOAK_JWKS_URI
    value: "http://develop.auth.crivo.local/realms/crivo/protocol/openid-connect/certs"
  - name: KEYCLOAK_ISSUER
    value: "http://develop.auth.crivo.local/realms/crivo"
  - name: STRIPE_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: devops-secrets
        key: stripe-secret-key
  - name: STRIPE_WEBHOOK_SECRET
    valueFrom:
      secretKeyRef:
        name: devops-secrets
        key: stripe-webhook-secret

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
