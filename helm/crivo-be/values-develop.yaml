# Values for Development environment
replicaCount: 1

image:
  repository: ghcr.io/geraldobl58/crivo-be
  tag: "develop-3f6ff070d963178ebc4d95527f97e852ea83f3a4"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

ingress:
  enabled: true
  className: "nginx"
  annotations:
  hosts:
    - host: develop.be.crivo.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

autoscaling:
  enabled: false

env:
  NODE_ENV: development
  PORT: "3000"
  LOG_LEVEL: debug
  SWAGGER_ENABLED: "true"
  METRICS_ENABLED: "true"
  # Database — Postgres Docker conectado à rede k3d-devops-lab (IP 172.19.0.11)
  DATABASE_URL: "postgresql://crivo:crivo_password@172.19.0.11:5432/crivo_app?schema=public"
  # Frontend / CORS
  FRONTEND_URL: "http://develop.fe.crivo.local"
  # Keycloak — internal service URL para token validation
  KEYCLOAK_BASE_URL: "http://develop.auth.crivo.local"
  KEYCLOAK_INTERNAL_URL: "http://crivo-auth:8080"
  KEYCLOAK_REALM: "crivo"
  KEYCLOAK_ISSUER: "http://develop.auth.crivo.local/realms/crivo"
  KEYCLOAK_JWKS_URI: "http://develop.auth.crivo.local/realms/crivo/protocol/openid-connect/certs"
  KEYCLOAK_CLIENT_ID: "crivo-api"
  KEYCLOAK_CLIENT_SECRET: "ZGYQ8zh7IUQy2HFaazv84Abv1MjqWYer"
  KEYCLOAK_WEB_CLIENT_ID: "crivo-web"
  # Misc stubs
  AI_PROVIDER: "anthropic"
  ANTHROPIC_API_KEY: "stub"
  AWS_ACCESS_KEY_ID: "stub"
  AWS_REGION: "us-east-1"
  AWS_SECRET_ACCESS_KEY: "stub"
  MAIL_PROVIDER: "nodemailer"
  MAILTRAP_HOST: "sandbox.smtp.mailtrap.io"
  MAILTRAP_PORT: "587"
  MAILTRAP_USER: "stub"
  MAILTRAP_PASSWORD: "stub"
  MAIL_FROM: "no-reply@crivo.local"
  STORAGE_PROVIDER: "s3"
  S3_BUCKET: "stub"
  STRIPE_PRICE_BASIC: "prod_stub"
  STRIPE_PRICE_ENTERPRISE: "prod_stub"
  STRIPE_PRICE_PROFESSIONAL: "prod_stub"
  STRIPE_SECRET_KEY: "stub"
  STRIPE_WEBHOOK_SECRET: "stub"

podDisruptionBudget:
  enabled: false

podAnnotations:
  app.kubernetes.io/commit: "3f6ff07"

metrics:
  enabled: false
  path: /metrics
  serviceMonitor:
    enabled: false

# Kubernetes Secret com as credenciais do Cloudinary.
# Criar o secret antes de implantar:
#   kubectl create secret generic crivo-be-cloudinary -n crivo-develop \
#     --from-literal=CLOUDINARY_CLOUD_NAME=xxx \
#     --from-literal=CLOUDINARY_API_KEY=xxx \
#     --from-literal=CLOUDINARY_API_SECRET=xxx \
#     --from-literal=CLOUDINARY_FOLDER=devops
envFrom:
  - secretRef: crivo-be-cloudinary
