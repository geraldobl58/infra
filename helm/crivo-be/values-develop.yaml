# Values for Development environment
replicaCount: 1

image:
  repository: ghcr.io/geraldobl58/crivo-be
  tag: "develop-3f6ff070d963178ebc4d95527f97e852ea83f3a4"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

ingress:
  enabled: true
  className: "nginx"
  annotations:
  hosts:
    - host: develop.be.crivo.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

autoscaling:
  enabled: false

env:
  - name: NODE_ENV
    value: "development"
  - name: PORT
    value: "3000"
  - name: LOG_LEVEL
    value: "debug"
  - name: SWAGGER_ENABLED
    value: "true"
  - name: METRICS_ENABLED
    value: "true"
  # Database — Postgres Docker conectado à rede k3d-devops-lab (IP 172.19.0.11)
  - name: DATABASE_URL
    value: "postgresql://crivo:crivo_password@172.19.0.11:5432/crivo_app?schema=public"
  # Frontend / CORS
  - name: FRONTEND_URL
    value: "http://develop.fe.crivo.local"
  # Keycloak — internal service URL para token validation
  - name: KEYCLOAK_BASE_URL
    value: "http://develop.auth.crivo.local"
  - name: KEYCLOAK_INTERNAL_URL
    value: "http://crivo-auth:8080"
  - name: KEYCLOAK_REALM
    value: "crivo"
  - name: KEYCLOAK_ISSUER
    value: "http://develop.auth.crivo.local/realms/crivo"
  - name: KEYCLOAK_JWKS_URI
    value: "http://develop.auth.crivo.local/realms/crivo/protocol/openid-connect/certs"
  - name: KEYCLOAK_CLIENT_ID
    value: "crivo-api"
  - name: KEYCLOAK_CLIENT_SECRET
    value: "ZGYQ8zh7IUQy2HFaazv84Abv1MjqWYer"
  - name: KEYCLOAK_WEB_CLIENT_ID
    value: "crivo-web"
  # Misc stubs
  - name: AI_PROVIDER
    value: "anthropic"
  - name: ANTHROPIC_API_KEY
    value: "stub"
  - name: AWS_ACCESS_KEY_ID
    value: "stub"
  - name: AWS_REGION
    value: "us-east-1"
  - name: AWS_SECRET_ACCESS_KEY
    value: "stub"
  - name: MAIL_PROVIDER
    value: "nodemailer"
  - name: MAILTRAP_HOST
    value: "sandbox.smtp.mailtrap.io"
  - name: MAILTRAP_PORT
    value: "587"
  - name: MAILTRAP_USER
    value: "stub"
  - name: MAILTRAP_PASSWORD
    value: "stub"
  - name: MAIL_FROM
    value: "no-reply@crivo.local"
  - name: STORAGE_PROVIDER
    value: "s3"
  - name: S3_BUCKET
    value: "stub"
  - name: STRIPE_PRICE_BASIC
    value: "prod_stub"
  - name: STRIPE_PRICE_ENTERPRISE
    value: "prod_stub"
  - name: STRIPE_PRICE_PROFESSIONAL
    value: "prod_stub"
  - name: STRIPE_SECRET_KEY
    value: "stub"
  - name: STRIPE_WEBHOOK_SECRET
    value: "stub"

hostAliases:
  - ip: "10.43.45.3"
    hostnames:
      - develop.auth.crivo.local
      - develop.be.crivo.local
      - develop.fe.crivo.local

podDisruptionBudget:
  enabled: false

podAnnotations:
  app.kubernetes.io/commit: "3f6ff07"

metrics:
  enabled: false
  path: /metrics
  serviceMonitor:
    enabled: false

# Kubernetes Secret com as credenciais do Cloudinary.
# Criar o secret antes de implantar:
#   kubectl create secret generic crivo-be-cloudinary -n crivo-develop \
#     --from-literal=CLOUDINARY_CLOUD_NAME=xxx \
#     --from-literal=CLOUDINARY_API_KEY=xxx \
#     --from-literal=CLOUDINARY_API_SECRET=xxx \
#     --from-literal=CLOUDINARY_FOLDER=devops
envFrom:
  - secretRef: crivo-be-cloudinary
