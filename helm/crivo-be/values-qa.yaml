# Values for QA environment
replicaCount: 1

image:
  repository: ghcr.io/geraldobl58/crivo-be
  tag: "develop"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

ingress:
  enabled: true
  className: "nginx"
  annotations:
  hosts:
    - host: qa.be.crivo.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

autoscaling:
  enabled: false

env:
  NODE_ENV: production
  PORT: "3000"
  LOG_LEVEL: info
  SWAGGER_ENABLED: "true"
  METRICS_ENABLED: "true"
  KEYCLOAK_BASE_URL: "http://qa.auth.crivo.local"
  KEYCLOAK_CLIENT_ID: crivo-api
  KEYCLOAK_CLIENT_SECRET: "dummy-secret"
  KEYCLOAK_WEB_CLIENT_ID: crivo-web
  KEYCLOAK_ISSUER: "http://main.auth.crivo.local/realms/devops"
  KEYCLOAK_JWKS_URI: "http://main.auth.crivo.local/realms/devops/protocol/openid-connect/certs"

  KEYCLOAK_INTERNAL_URL: "http://crivo-auth-qa:8080"
  KEYCLOAK_REALM: devops
  FRONTEND_URL: "http://prod.fe.crivo.local"
  DATABASE_URL: "postgresql://crivo:crivo_password@localhost:5432/crivo_app?schema=public"
  MAILTRAP_HOST: "sandbox.smtp.mailtrap.io"
  MAILTRAP_PORT: "587"
  MAILTRAP_USER: "stub"
  MAILTRAP_PASSWORD: "stub"
  MAIL_PROVIDER: "nodemailer"
  MAIL_FROM: "no-reply@crivo.local"
  STRIPE_SECRET_KEY: "sk_test_stub"
  STRIPE_PUBLISHABLE_KEY: "pk_test_stub"
  STRIPE_WEBHOOK_SECRET: "whsec_stub"
  STRIPE_PRICE_TRIAL: "prod_stub"
  STRIPE_PRICE_BASIC: "prod_stub"
  STRIPE_PRICE_PROFESSIONAL: "prod_stub"
  STRIPE_PRICE_ENTERPRISE: "prod_stub"
  AI_PROVIDER: "anthropic"
  ANTHROPIC_API_KEY: "stub"
  STORAGE_PROVIDER: "s3"
  AWS_REGION: "us-east-1"
  AWS_ACCESS_KEY_ID: "stub"
  AWS_SECRET_ACCESS_KEY: "stub"
  S3_BUCKET: "stub"


podDisruptionBudget:
  enabled: false

podAnnotations:
  app.kubernetes.io/commit: "pending"

metrics:
  enabled: false
  path: /metrics
  serviceMonitor:
    enabled: false

# Kubernetes Secret com as credenciais do Cloudinary.
# Criar o secret antes de implantar:
#   kubectl create secret generic crivo-be-cloudinary -n crivo-qa \
#     --from-literal=CLOUDINARY_CLOUD_NAME=xxx \
#     --from-literal=CLOUDINARY_API_KEY=xxx \
#     --from-literal=CLOUDINARY_API_SECRET=xxx \
#     --from-literal=CLOUDINARY_FOLDER=devops
envFrom:
  - secretRef: crivo-be-cloudinary
