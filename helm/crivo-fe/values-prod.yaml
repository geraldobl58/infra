# Values for Production environment
replicaCount: 1

image:
  repository: ghcr.io/geraldobl58/crivo-fe
  tag: "develop"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

ingress:
  enabled: true
  className: "nginx"
  annotations:
  hosts:
    - host: fe.crivo.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

autoscaling:
  enabled: false

env:
  NODE_ENV: production
  BETTER_AUTH_SECRET: "crivo-super-secret-key-for-better-auth"
  BETTER_AUTH_URL: "http://main.fe.crivo.local"

  API_URL: http://crivo-be-prod:3000
  NEXT_PUBLIC_API_URL: http://be.crivo.local
  NEXT_PUBLIC_KEYCLOAK_URL: http://auth.crivo.local
  NEXT_PUBLIC_KEYCLOAK_REALM: devops
  NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: devops-web

podDisruptionBudget:
  enabled: true
  minAvailable: 1

podAnnotations:
  app.kubernetes.io/commit: "initial"

metrics:
  enabled: false
  path: /api/metrics
  serviceMonitor:
    enabled: false
